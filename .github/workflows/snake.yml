name: cobrinha de contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1F7A63&color_dots=#EBEDF0,#B7DCCF,#6FB39C,#2F8B70,#1F7A63
            dist/snake-dark.svg?palette=github-dark&color_snake=#6FB39C&color_dots=#161B22,#12314A,#1F5A4A,#2F8B70,#6FB39C

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
